<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YunYu 的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            color: #333;
            background-color: #f7f8fa;
        }
        nav {
            background: #222;
            padding: 1rem;
            position: sticky;
            top:0;
        }
        .nav-wrap {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-wrap a {
            color: white;
            text-decoration: none;
        }
        .nav-wrap a:hover {
            color: #60a5fa;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 20px;
        }
        .hero {
            text-align:center;
            padding: 6rem 20px;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .hero p {
            font-size:1.1rem;
            color:#555;
        }
        section {
            padding: 4rem 20px;
        }
        section h2 {
            text-align:center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .about {
            background:#fff;
        }
        .game-section {
            background:#eef6ff;
            text-align:center;
        }
        .game-btn {
            display: inline-block;
            padding:14px 32px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius: 8px;
            font-size:18px;
            transition: 0.2s;
        }
        .game-btn:hover {
            background:#1d4ed8;
        }
        .project-card {
            background:#fff;
            padding:24px;
            border-radius:10px;
            margin-bottom:16px;
            box-shadow:0 2px 8px #00000012;
        }
        footer {
            text-align:center;
            padding:2rem;
            background:#222;
            color:#aaa;
        }
    </style>
</head>
<body>
    <!-- 导航栏，自带游戏入口跳转 -->
    <nav>
        <div class="nav-wrap">
            <a href="#">首页</a>
            <a href="#about">关于我</a>
            <a href="#projects">项目</a>
            <a href="#game">🎮小游戏</a>
            <a href="#contact">联系我</a>
        </div>
    </nav>

    <div class="hero">
        <h1>你好，我是云浴</h1>
        <p>个人主页 | 作品集 | 小游戏站点</p>
    </div>

    <section id="about" class="about">
        <div class="container">
            <h2>关于我</h2>
            <p>在这里可以介绍你自己，爱好、技能等等。</p>
        </div>
    </section>

    <section id="projects">
        <div class="container">
            <h2>我的项目</h2>
            <div class="project-card">
                <h3>个人网站</h3>
                <p>基于 GitHub Pages 搭建的静态个人站点</p>
            </div>
        </div>
    </section>

    <!-- 游戏入口板块 -->
    <section id="game" class="game-section">
        <div class="container">
            <h2>🎮 小游戏入口</h2>
            <p>点击下方按钮进入游戏</p>
            <br>
            <a href="game.html" target="_blank" class="game-btn">进入游戏</a>
            <p style="margin-top:16px; font-size:14px; color:#555;">
                提示：把你的小游戏文件命名 game.html，上传到仓库根目录即可
            </p>
        </div>
    </section>

    <section id="contact">
        <div class="container">
            <h2>联系我</h2>
            <p>邮箱：填写你的邮箱</p>
        </div>
    </section>

    <footer>
        <p>© 2026 云浴 | 托管于 GitHub Pages</p>
    </footer>
</body>
</html>
